name: PB Bot NY Session Paper Runner

on:
  schedule:
    - cron: "30 8 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Run duration in minutes"
        type: number
        default: 180

permissions:
  contents: read

concurrency:
  group: pb-paper-session
  cancel-in-progress: false

jobs:
  run-paper-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 210

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper trading session
        shell: bash
        env:
          MAX_MINS: ${{ inputs.max_minutes || 180 }}
        run: |
          mkdir -p paper_logs_live
          python -u paper_runner.py \
            --live \
            --poll-sec 60 \
            --lookback-days 5 \
            --max-minutes "$MAX_MINS" \
            --log-dir paper_logs_live \
            2>&1 | tee paper_logs_live/runner.log

      - name: Save session logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb-paper-session-${{ github.run_id }}
          path: paper_logs_live/
          retention-days: 30
